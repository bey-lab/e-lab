name: E-lab browser smoke test
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repair code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1 jszip@3.10.1
          npx playwright install --with-deps chromium
      - name: Run Chromium smoke tests
        run: node test/ci-smoke.mjs
